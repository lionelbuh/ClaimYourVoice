kind = "web"
previewPath = "/"
title = "ClaimYourVoice"
version = "1.0.0"
id = "artifacts/claim-your-voice"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24523

[services.development]
run = "pnpm --filter @workspace/claim-your-voice run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/claim-your-voice", "run", "build" ]
publicDir = "artifacts/claim-your-voice/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24523"
BASE_PATH = "/"
